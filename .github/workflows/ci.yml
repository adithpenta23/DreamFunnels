name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret placeholders: this job never talks to Supabase. The build
      # only needs well-formed values, and the RLS suite runs on PGlite.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit, component and database (RLS) tests
        run: npm test

      - name: Production build
        run: npm run build

  database:
    name: Database (migrations · db lint · type drift)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The repo's pinned CLI (devDependency). Fails on invalid SQL or any
      # migration error, since every migration is applied from scratch.
      - name: Start Postgres and apply every migration
        run: npx supabase db start

      - name: Migrations applied
        run: npx supabase migration list --local

      # Local database only: CI never connects to a hosted project. No
      # exceptions are configured; add narrow, documented ones (docs/QA.md) if
      # a finding is ever deliberate.
      - name: Lint the schema (supabase db lint)
        run: npx supabase db lint --local --level warning --fail-on warning

      - name: Generated types match the migrations
        run: npm run db:types:check

      - name: The working tree is unchanged
        run: git diff --exit-code

  e2e:
    name: E2E (Playwright + local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Fail, rather than skip, the signed-in specs if Supabase didn't start.
      E2E_REQUIRE_SUPABASE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (Postgres, Auth, REST, Mailpit) with our migrations
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor

      - name: Point the app at the local stack
        # Local-stack keys are well-known development defaults, not secrets.
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests (smoke + signed-in flows)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-confirmation:
    name: E2E with email confirmation (Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_REQUIRE_SUPABASE: "1"
      # Fail, rather than skip, if the stack still auto-confirms sign-ups.
      E2E_REQUIRE_EMAIL_CONFIRMATION: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI-only: this runner's checkout gets confirmation on (as in staging and
      # production) and room for several confirmation emails. The committed
      # config.toml, used locally and by the other jobs, is unchanged.
      - name: Turn email confirmation on
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/ci/enable-email-confirmation.mts

      - name: Start Supabase (Postgres, Auth, REST, Mailpit) with our migrations
        run: >-
          npx supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor

      - name: Point the app at the local stack
        # Local-stack keys are well-known development defaults, not secrets.
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the confirmation journeys (links read from Mailpit)
        run: npm run test:e2e:confirmation

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-confirmation
          path: playwright-report/
          retention-days: 7
