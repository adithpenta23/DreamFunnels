name: Deploy database

# Applies supabase/migrations to a hosted Supabase project, then checks that
# project's Auth settings (email confirmation on, asymmetric JWT signing keys).
#
# Manual only. Each target is a GitHub Environment (Settings -> Environments:
# "staging", "production") holding that project's values; give "production"
# required reviewers. See docs/ARCHITECTURE.md "Environments".
#   secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   vars:    SUPABASE_PROJECT_REF, NEXT_PUBLIC_SUPABASE_URL,
#            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link the Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migrations (local vs remote)
        run: npx supabase migration list

      - name: Apply pending migrations
        run: npx supabase db push

      - name: Verify Auth configuration
        run: npm run verify:hosted
