<!-- Signup confirmation. {{ .TokenHash }} links work across devices (see /auth/callback). -->
<h2>Confirm your email</h2>
<p>Welcome to DreamFunnels! Confirm this address to finish creating your account.</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/dashboard">
    Confirm my email
  </a>
</p>
<p>If you didn't sign up, you can ignore this email.</p>
